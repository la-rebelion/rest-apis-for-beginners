openapi: 3.1.0
info:
  title: Rebel Coffee Orders
  version: 1.0.0
  description: A tiny fictional order service for a coffee shop.
servers:
  - url: http://localhost:3000
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: Returns recent orders, newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, shipped, delivered] }
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '201':
          description: The created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: Order not found
components:
  schemas:
    NewOrder:
      type: object
      required: [item, quantity]
      properties:
        item: { type: string }
        quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      properties:
        id: { type: string }
        item: { type: string }
        quantity: { type: integer }
        status: { type: string }
